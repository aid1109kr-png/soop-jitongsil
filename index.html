<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOOP LIVE 지통실</title>
<style>
:root{--bg:#050505;--panel:#0d0d0f;--line:#202024;--muted:#8b8b93;--white:#f5f5f7;--red:#ff3038}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
body{min-height:100vh}
header{height:68px;padding:0 22px;border-bottom:1px solid var(--line);background:#080808;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}.brand .dot{width:10px;height:10px;background:var(--red);border-radius:50%;box-shadow:0 0 12px #ff3038}.brand h1{font-size:19px;margin:0;letter-spacing:-.5px}
.actions{display:flex;align-items:center;gap:10px}.clock{font-size:12px;color:var(--muted)}
button{border:1px solid #303038;background:#151519;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700}
button:hover{background:#202026}.grid{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1800px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px #0008}
.player{position:relative;aspect-ratio:16/9;background:#020202;overflow:hidden;cursor:pointer}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0008 0%,transparent 22%,transparent 76%,#0009 100%)}
.live{position:absolute;top:12px;left:12px;background:var(--red);padding:5px 8px;border-radius:5px;font-size:11px;font-weight:900;letter-spacing:.4px;box-shadow:0 2px 12px #0008}
.live i{display:inline-block;width:6px;height:6px;background:#fff;border-radius:50%;margin-right:5px;vertical-align:1px}
.viewer{position:absolute;top:12px;right:12px;background:#080808d9;border:1px solid #ffffff18;padding:5px 8px;border-radius:5px;font-size:11px;color:#ddd}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s}
.center span{background:#000d;border:1px solid #ffffff25;border-radius:999px;padding:11px 17px;font-size:13px;font-weight:800}
.player:hover .center{opacity:1}
.meta{padding:12px 14px 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-size:16px;font-weight:850}.id{font-size:11px;color:#777780;margin-top:4px}
.title{margin:9px 0 0;font-size:13px;color:#d6d6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{font-size:11px;color:#9999a2;white-space:nowrap}.status{font-size:11px;color:#85858e}
.note{padding:0 15px 14px;color:#66666e;font-size:10px}
@media(max-width:800px){header{padding:0 12px}.clock{display:none}.grid{grid-template-columns:1fr;padding:9px}.card{border-radius:8px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><h1>SOOP LIVE 지통실</h1></div>
  <div class="actions"><span class="clock" id="clock"></span><button onclick="reloadAll()">↻ 새로고침</button></div>
</header>

<main class="grid" id="grid"></main>

<script>
const streams=[
 {name:"싱유",id:"singu64",url:"https://play.sooplive.com/singu64/297415805",embed:"https://play.sooplive.com/singu64/embed"},
 {name:"목츄리",id:"xex3",url:"https://play.sooplive.com/xex3/297485569",embed:"https://play.sooplive.com/xex3/embed"},
 {name:"이투",id:"etwo22",url:"https://play.sooplive.com/etwo22/297486571",embed:"https://play.sooplive.com/etwo22/embed"},
 {name:"한아련",id:"rkdmsdl782",url:"https://play.sooplive.com/rkdmsdl782/297483697",embed:"https://play.sooplive.com/rkdmsdl782/embed"}
];

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 document.getElementById("grid").innerHTML=streams.map((s,i)=>`
 <section class="card">
   <div class="player" onclick="openStream(${i})">
     <iframe id="frame${i}" src="${s.embed}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
     <div class="shade"></div>
     <div class="live"><i></i>LIVE</div>
     <div class="viewer">● 시청자 수 확인 중</div>
     <div class="center"><span>방송 입장 ↗</span></div>
   </div>
   <div class="meta">
     <div class="row"><div><div class="name">${esc(s.name)}</div><div class="id">${esc(s.id)}</div></div><div class="stats">LIVE</div></div>
     <div class="title">방송 정보를 불러오는 중...</div>
   </div>
   <div class="note">화면을 클릭하면 SOOP 방송 페이지로 이동합니다.</div>
 </section>`).join("");
}
function openStream(i){window.open(streams[i].url,"_blank","noopener,noreferrer")}
function reloadAll(){
 streams.forEach((s,i)=>{const f=document.getElementById("frame"+i); if(f){f.src=s.embed+(s.embed.includes("?")?"&":"?")+"reload="+Date.now()}})
}
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("ko-KR",{hour12:false})}
render();tick();setInterval(tick,1000);
</script>
</body>
</html>
